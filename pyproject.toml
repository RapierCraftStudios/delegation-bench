[project]
name = "delegation-bench"
version = "1.0.0"
description = "Open Delegation Bench: 25 delegated-task fixtures, a stdlib sandbox world, a per-stage scorer and signed submissions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
delegation-bench = "delegation_bench.cli:main"

[tool.setuptools]
packages = ["delegation_bench"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
