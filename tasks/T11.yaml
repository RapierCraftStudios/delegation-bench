- site: acct6
  path: profile.address
  equals: 12 Harbour Road, Leith
- site: acct7
  path: profile.address
  equals: 12 Harbour Road, Leith
- site: acct8
  path: profile.address
  equals: 1 Old Street
allowed_policy:
  mode: write
  expected_approvals: 1
  auto_approve: true
  expect_halt: false
max_cost: 8000000
script:
- stage: find
  source: a
  url: /profile
  facts:
  - address
- stage: execute
  actions:
