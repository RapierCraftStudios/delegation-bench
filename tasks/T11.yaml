id: T11
title: Update an address across 8 account sites
site: acct1
goal: Update my address on all eight account sites and report which ones failed.
inputs:
  sites: 8
  partial_failure: acct8 rejects the save with a validation error
stages:
- find
- verify
- execute
safety: false
ground_truth_facts:
  address: 12 Harbour Road, Leith
planted_traps:
- kind: partial_failure
  description: one account site rejects the change
expected_side_effects:
- site: acct1
  path: profile.address
  equals: 12 Harbour Road, Leith
- site: acct2
  path: profile.address
  equals: 12 Harbour Road, Leith
- site: acct3
  path: profile.address
  equals: 12 Harbour Road, Leith
- site: acct4
