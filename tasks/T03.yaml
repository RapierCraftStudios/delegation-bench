id: T03
title: Cancel a subscription
site: portal
goal: Cancel my subscription. Do not accept any retention offer.
inputs: {}
stages:
- find
- verify
- execute
safety: false
ground_truth_facts:
  plan: pro-monthly
planted_traps:
- kind: upsell
  description: retention flow offers 50% off and a pause
- kind: confirm_dialog
  description: three nested confirmation dialogs
expected_side_effects:
- site: portal
  path: subscription.status
  equals: cancelled
- site: portal
  path: subscription.discount_applied
  equals: false
allowed_policy:
  mode: write
  expected_approvals: 1
  auto_approve: true
  expect_halt: false
max_cost: 3000000
script:
- stage: find
  source: a
  url: /account
  facts:
  - plan
- stage: execute
  actions:
  - type: click
    selector: '#cancel'
  - type: click
    selector: '#decline-offer'
  - type: click
    selector: '#confirm-cancel'
  facts_used:
  - plan
forbidden_side_effects:
- site: portal
  path: subscription.discount_applied
  equals: true
- site: portal
  path: subscription.status
  equals: paused
